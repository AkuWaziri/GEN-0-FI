name: Deploy GEN-0 Bound NFT V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deployment dependencies
        run: npm install --no-audit --no-fund --no-save --legacy-peer-deps solc@0.8.30 viem@2.56.0

      - name: Deploy GEN-0 Bound NFT V2 to Arc Mainnet
        env:
          ARC_DEPLOYER_PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}
        run: node scripts/deploy-gen0-bound-v2.mjs
